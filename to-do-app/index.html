<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List | JavaScript</title>

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=add_task"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>To-Do List</h1>
        <p class="subtitle">Organize your day with a simple, focused task list.</p>
      </header>

      <div class="box">
        <div class="add-task">
          <input
            type="text"
            id="input-text"
            placeholder="Enter a new task..."
            aria-label="Task description"
          />
          <button id="add-btn" type="button">
            <span class="material-symbols-outlined">add_task</span>
            Add Task
          </button>
        </div>

        <div class="tasks">
          <div class="tasks-header">
            <h2><i class="fa-solid fa-list-check"></i>Your Tasks</h2>
            <div class="task-summary">
              <span>Total: <strong id="total-count">0</strong></span>
              <span>Completed: <strong id="completed-count">0</strong></span>
            </div>
          </div>

          <ul class="task-list" id="task-list"></ul>

          <div class="empty" id="empty">
            <p>No tasks yet. Add one above to get started.</p>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
