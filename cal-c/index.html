<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cal-C | Scientific Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="calculator" aria-label="Scientific calculator">
      <div class="topbar">
        <div>
          <p class="eyebrow">Cal-C</p>
          <h1>Scientific Calculator</h1>
        </div>
        <button class="mode-toggle" id="angleToggle" type="button" aria-pressed="false">DEG</button>
      </div>

      <div class="screen">
        <p class="history" id="history">Ready</p>
        <div class="display" id="display" aria-live="polite">0</div>
      </div>

      <div class="keypad">
        <button class="key key-muted" type="button" data-action="clear">AC</button>
        <button class="key key-muted" type="button" data-action="backspace">DEL</button>
        <button class="key key-muted" type="button" data-value="(">(</button>
        <button class="key key-muted" type="button" data-value=")">)</button>
        <button class="key key-accent" type="button" data-value="/">/</button>

        <button class="key key-fn" type="button" data-value="sin(">sin</button>
        <button class="key key-fn" type="button" data-value="cos(">cos</button>
        <button class="key key-fn" type="button" data-value="tan(">tan</button>
        <button class="key key-fn" type="button" data-value="sqrt(">sqrt</button>
        <button class="key key-accent" type="button" data-value="*">*</button>

        <button class="key key-fn" type="button" data-value="log(">log</button>
        <button class="key key-fn" type="button" data-value="ln(">ln</button>
        <button class="key key-fn" type="button" data-value="abs(">abs</button>
        <button class="key key-fn" type="button" data-value="^">x^y</button>
        <button class="key key-accent" type="button" data-value="-">-</button>

        <button class="key key-fn" type="button" data-value="pi">pi</button>
        <button class="key key-fn" type="button" data-value="e">e</button>
        <button class="key key-fn" type="button" data-value="exp(">exp</button>
        <button class="key key-fn" type="button" data-action="factorial">x!</button>
        <button class="key key-accent" type="button" data-value="+">+</button>

        <button class="key" type="button" data-value="7">7</button>
        <button class="key" type="button" data-value="8">8</button>
        <button class="key" type="button" data-value="9">9</button>
        <button class="key" type="button" data-value="%">%</button>
        <button class="key key-action key-tall" type="button" data-action="equals">=</button>

        <button class="key" type="button" data-value="4">4</button>
        <button class="key" type="button" data-value="5">5</button>
        <button class="key" type="button" data-value="6">6</button>
        <button class="key" type="button" data-value="00">00</button>

        <button class="key" type="button" data-value="1">1</button>
        <button class="key" type="button" data-value="2">2</button>
        <button class="key" type="button" data-value="3">3</button>
        <button class="key" type="button" data-value=".">.</button>

        <button class="key key-wide" type="button" data-action="negate">+/-</button>
        <button class="key" type="button" data-value="0">0</button>
        <button class="key key-wide" type="button" data-action="ans">ANS</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
