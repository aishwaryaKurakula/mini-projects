<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator | Java script</title>
    
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=content_copy" />
 
</head>
<body>
    <div class="container">
        <h2>password generator</h2>

        <div class="inputBox">
            <input type="text" class="passBox" id="passBox" disabled>
        <span class="material-symbols-outlined" id="copyIcon">
content_copy
</span></div>
        
        <div class="strengthIndicator">
            <span id="strengthLabel">Strength: None</span>
            <div class="strengthBar" id="strengthBar"></div>
        </div>
        
        <div class="slider-container"><input type="range" id="lengthSlider" min="4" max="30" value="4">
           
        <span id="lengthValue">4</span></div>
         <p>password Length</p>

<div class="row">
    <label for="Lowercase">Include Lowercase Letters(a-z)</label>
        <input type="checkbox" name="Lowercase" id="Lowercase" checked>
</div>


<div class="row">
    <label for="Uppercase">Include Uppercase Letters(A-Z)</label>
        <input type="checkbox" name="Uppercase" id="Uppercase" checked>
</div>

<div class="row">
    <label for="Numbers">Include numbers(0-9)</label>
        <input type="checkbox" name="Numbers" id="Numbers" checked>
</div>

<div class="row">
    <label for="Symbols">Include Symbols(@#$)</label>
        <input type="checkbox" name="Symbols" id="Symbols" checked>
</div>

<button type="button" class="btn" id="btn">Generate Password</button>




    </div>

    <script src="script.js"></script>
</body>
</html>
